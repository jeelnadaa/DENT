<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="t d">
<title id="t">DENT 2.0</title>
<desc id="d">Animated banner: a generic AI-template layout is hit by an orange dot and replaced by the DENT wordmark, the tagline "Make a dent with your product's design." and the workflow route, plan and audit, direct, build, verify, score.</desc>
<defs>
  <radialGradient id="blob" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8B6CFF"/><stop offset=".55" stop-color="#4F7DF5"/><stop offset="1" stop-color="#4F7DF5" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
  <clipPath id="rise"><rect x="100" y="120" width="880" height="242"/></clipPath>
  <clipPath id="type"><rect class="typemask" x="118" y="392" width="700" height="56"/></clipPath>
</defs>
<style>
  .tpl, .ball, .ring, .l, .w, .typemask, .rule, .label, .tag { transform-box: fill-box; }
  .tpl { animation: scatter .7s cubic-bezier(.7,0,.84,0) 1.55s both; transform-origin: 50% 50%; }
  .t1 { --x:-240px; --y:-60px; --r:-14deg; } .t2 { --x:0px; --y:-220px; --r:6deg; } .t3 { --x:260px; --y:-40px; --r:16deg; }
  .t4 { --x:0px; --y:120px; --r:0deg; } .t5 { --x:-60px; --y:-160px; --r:-4deg; } .t6 { --x:40px; --y:160px; --r:8deg; }
  @keyframes scatter { to { transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(.85); opacity: 0; } }
  .blob { animation: vanish .6s cubic-bezier(.7,0,.84,0) 1.55s both; transform-origin: 50% 50%; }
  @keyframes vanish { to { transform: scale(0); opacity: 0; } }
  .ball { transform-origin: 50% 100%; animation: dropsquash 1.12s .9s both; }
  @keyframes dropsquash {
    0% { transform: translateY(-440px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
    55% { transform: translateY(0) scale(1,1); animation-timing-function: cubic-bezier(.16,1,.3,1); }
    64% { transform: scale(1.35,.7); animation-timing-function: cubic-bezier(.16,1,.3,1); }
    82% { transform: scale(.92,1.08); }
    100% { transform: none; }
  }
  .ring { transform-origin: 50% 50%; opacity: 0; animation: ring .75s cubic-bezier(.16,1,.3,1) 1.52s forwards; }
  @keyframes ring { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(9); } }
  .l { animation: rise .9s cubic-bezier(.16,1,.3,1) both; }
  .l0 { animation-delay: 1.9s; } .l1 { animation-delay: 1.99s; } .l2 { animation-delay: 2.08s; } .l3 { animation-delay: 2.17s; }
  @keyframes rise { from { transform: translateY(250px); } to { transform: translateY(0); } }
  .typemask { transform-origin: 0 50%; animation: wipe 1.1s cubic-bezier(.65,0,.35,1) 2.9s both; }
  @keyframes wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .rule { transform-origin: 0 50%; animation: wipe .8s cubic-bezier(.65,0,.35,1) 3.7s both; }
  .label { animation: fade .6s ease-out 2.6s both; }
  .w { animation: slide .5s cubic-bezier(.16,1,.3,1) both; }
  .w0 { animation-delay: 4.0s; } .w1 { animation-delay: 4.12s; } .w2 { animation-delay: 4.24s; } .w3 { animation-delay: 4.36s; } .w4 { animation-delay: 4.48s; } .w5 { animation-delay: 4.6s; }
  @keyframes slide { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .tpl, .blob { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    *, .tpl, .blob, .ball, .ring, .l, .w, .typemask, .rule, .label { animation: none !important; }
    .tpl, .blob, .ring { opacity: 0 !important; }
  }
</style>
<rect width="1280" height="480" fill="#0E0E0C"/>

<!-- The generic template (what DENT replaces) -->
<g class="blob"><circle cx="640" cy="250" r="190" fill="url(#blob)" opacity=".55" filter="url(#soft)"/></g>
<g class="tpl t5"><rect x="548" y="86" width="184" height="30" rx="15" fill="#34322D"/><text x="640" y="106" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#B3AEA3">&#10022; New: AI-powered</text></g>
<g class="tpl t4"><rect x="400" y="136" width="480" height="18" rx="9" fill="#34322D"/><rect x="460" y="166" width="360" height="14" rx="7" fill="#2A2925"/></g>
<g class="tpl t1"><rect x="160" y="208" width="290" height="190" rx="22" fill="#171714" stroke="#2A2925"/><circle cx="200" cy="248" r="16" fill="#34322D"/><rect x="184" y="282" width="180" height="14" rx="7" fill="#34322D"/><rect x="184" y="308" width="230" height="10" rx="5" fill="#2A2925"/><rect x="184" y="326" width="200" height="10" rx="5" fill="#2A2925"/></g>
<g class="tpl t2"><rect x="495" y="208" width="290" height="190" rx="22" fill="#171714" stroke="#2A2925"/><circle cx="535" cy="248" r="16" fill="#34322D"/><rect x="519" y="282" width="180" height="14" rx="7" fill="#34322D"/><rect x="519" y="308" width="230" height="10" rx="5" fill="#2A2925"/><rect x="519" y="326" width="200" height="10" rx="5" fill="#2A2925"/></g>
<g class="tpl t3"><rect x="830" y="208" width="290" height="190" rx="22" fill="#171714" stroke="#2A2925"/><circle cx="870" cy="248" r="16" fill="#34322D"/><rect x="854" y="282" width="180" height="14" rx="7" fill="#34322D"/><rect x="854" y="308" width="230" height="10" rx="5" fill="#2A2925"/><rect x="854" y="326" width="200" height="10" rx="5" fill="#2A2925"/></g>
<g class="tpl t6"><rect x="560" y="420" width="160" height="40" rx="20" fill="#34322D"/></g>

<!-- DENT -->
<text class="label" x="120" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="3" fill="#B3AEA3">DENT 2.0 &#8212; OPEN-SOURCE DESIGN ENGINEERING FOR AI AGENTS</text>
<g clip-path="url(#rise)"><g class="l l0"><path transform="translate(120 140)" d="M0 0H92A110 110 0 0 1 92 220H0ZM46 46V174H90A64 64 0 0 0 90 46Z" fill="#F3F0E8" fill-rule="evenodd"/></g><g class="l l1"><path transform="translate(350 140)" d="M0 0H150V46H46V88H132V132H46V174H150V220H0Z" fill="#F3F0E8" fill-rule="evenodd"/></g><g class="l l2"><path transform="translate(530 140)" d="M0 0H46L110 128V0H156V220H110L46 92V220H0Z" fill="#F3F0E8" fill-rule="evenodd"/></g><g class="l l3"><path transform="translate(716 140)" d="M0 0H160V46H103V220H57V46H0Z" fill="#F3F0E8" fill-rule="evenodd"/></g></g>
<circle class="ring" cx="926" cy="334" r="26" fill="none" stroke="#FF5A1F" stroke-width="3"/>
<g class="ball"><circle cx="926" cy="334" r="26" fill="#FF5A1F"/></g>
<g clip-path="url(#type)"><text x="120" y="432" font-family="Georgia, 'Times New Roman', Times, serif" font-style="italic" font-size="34" fill="#F3F0E8">Make a dent with your product&#8217;s design.</text></g>
<rect class="rule" x="120" y="450" width="660" height="2" fill="#FF5A1F"/>
<g class="w w0"><rect x="1000" y="162" width="8" height="8" fill="#F3F0E8"/><text x="1020" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="2" fill="#F3F0E8">01  ROUTE</text></g><g class="w w1"><rect x="1000" y="196" width="8" height="8" fill="#F3F0E8"/><text x="1020" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="2" fill="#F3F0E8">02  PLAN + AUDIT</text></g><g class="w w2"><rect x="1000" y="230" width="8" height="8" fill="#F3F0E8"/><text x="1020" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="2" fill="#F3F0E8">03  DIRECT</text></g><g class="w w3"><rect x="1000" y="264" width="8" height="8" fill="#F3F0E8"/><text x="1020" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="2" fill="#F3F0E8">04  BUILD</text></g><g class="w w4"><rect x="1000" y="298" width="8" height="8" fill="#FF5A1F"/><text x="1020" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="2" fill="#F3F0E8">05  VERIFY</text></g><g class="w w5"><rect x="1000" y="332" width="8" height="8" fill="#F3F0E8"/><text x="1020" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="2" fill="#F3F0E8">06  SCORE</text></g>
</svg>
