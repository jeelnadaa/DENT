<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · DENT</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121212'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='%23FF5A1F'/%3E%3C/svg%3E">
<script>(function(){try{var t=localStorage.getItem('dent-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&family=Geist+Mono:wght@500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{--paper:#FBFAF6;--ink:#121212;--muted:#5C5850;--rule:#D8D3C7;--dot:#E8461E;--on-dot:#121212;--focus:#121212}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#171714;--ink:#F3F0E8;--muted:#A8A196;--rule:#34322D;--dot:#FF5A1F;--focus:#F3F0E8}}
:root[data-theme="dark"]{--paper:#171714;--ink:#F3F0E8;--muted:#A8A196;--rule:#34322D;--dot:#FF5A1F;--focus:#F3F0E8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 Geist,ui-sans-serif,system-ui,sans-serif}
main{max-width:560px}
.k{font:500 .75rem/1.3 "Geist Mono",ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 20px}
h1{font:400 clamp(2.75rem,2rem + 4vw,4.5rem)/.95 "Instrument Serif",Georgia,serif;letter-spacing:-.02em;margin:0 0 20px}
h1 em{font-style:italic}
h1 i{display:inline-block;width:.18em;height:.18em;border-radius:50%;background:var(--dot);margin-left:.04em}
p{margin:0 0 28px;color:var(--muted)}
a.btn{display:inline-flex;align-items:center;min-height:52px;padding:0 22px;border-radius:3px;background:var(--dot);color:var(--on-dot);font-weight:600;text-decoration:none}
a.btn:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="k">404 · Page not found</p>
  <h1>Nothing to <em>dent</em> here<i aria-hidden="true"></i></h1>
  <p>This address doesn't exist. The landing page has everything about DENT.</p>
  <a class="btn" href="/">Go to the DENT home page</a>
</main>
</body>
</html>
