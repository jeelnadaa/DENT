<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Streak: "Roots" launch trailer</title>
<!-- Fonts chosen with scripts/fonts.py suggest/check (all "fresh enough", OFL via Google Fonts):
     BioRhyme (wide slab serif, wdth axis) = statements; Georama (wdth) = the app's own UI; Sometype Mono = data and labels. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BioRhyme:wdth,wght@100..125,200..800&family=Georama:wdth,wght@62.5..150,100..900&family=Sometype+Mono:wght@400..700&display=block">
<style>
/* Palette from scripts/palette.py make --accent #C9D94A --second #E9B44C --neutral warm (name "rootsystem").
   Colour script: act 1 sterile grey (the checkmark world) -> act 2 soil + pollen-gold roots + chartreuse growth -> act 3 dawn gold. */
:root{
  --soil:#18140F; --soil2:#221D18; --soil3:#322D27; --loam:#47413A;
  --root:#E9B44C; --sprout:#C9D94A; --leaf:#88940B; --leafdk:#5C640A; --wilt:#B08218;
  --cream:#FCF8F5; --app:#F4EFE6; --appline:#E2DBD0; --ink:#18140F; --muted:#605A53;
  --sterile:#E9ECEE; --sterile2:#D6DADD; --steel:#2A2F33; --miss:#B3313C;
  --dawn1:#F3D69B; --dawn2:#F8EEDB;
  --state:"BioRhyme",serif; --ui:"Georama",sans-serif; --mono:"Sometype Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;background:var(--sterile);color:var(--ink)}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.L{position:absolute;inset:0}
.a{position:absolute}
#sky{background:var(--sterile)}
#soil{background:var(--soil)}
#soil .strata{position:absolute;left:-10%;right:-10%;height:300%;top:0;
  background:repeating-linear-gradient(180deg,rgba(233,180,76,.035) 0 3%,transparent 3% 7%,rgba(0,0,0,.25) 7% 8%,transparent 8% 12%)}
#soil .fringe{position:absolute;left:0;right:0;top:-14px;height:30px}
#under{overflow:hidden}
.pebble{position:absolute;border-radius:46% 54% 50% 50%;background:var(--soil3)}
.mote{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--root);opacity:.35}
/* statements */
.st{font-family:var(--state);font-weight:800;font-stretch:125%;letter-spacing:-.035em;line-height:.95}
.st i{font-style:normal;font-weight:300;font-stretch:100%}
.line{display:block;overflow:clip;padding-bottom:.08em}
.line>span{display:inline-block}
.lab{font-family:var(--mono);font-weight:500;text-transform:uppercase;letter-spacing:.1em}
/* hook grid (the sterile checkmark world) */
.cell{position:absolute;border-radius:14px;background:#F6F7F8;border:2px solid var(--sterile2)}
.cell b{position:absolute;left:10px;top:6px;font:500 18px var(--mono);color:#7B8186}
.cell svg{position:absolute;inset:0;overflow:visible}
/* phone (the app is a faithful HTML reenactment designed for this film: Streak is fictional) */
.phone{position:absolute;width:410px;height:860px;border-radius:58px;background:#14110D;padding:12px;transform-origin:50% 100%;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.phone.droid{border-radius:40px}
.scr{position:relative;width:100%;height:100%;border-radius:46px;background:var(--app);overflow:hidden;font-family:var(--ui);color:var(--ink)}
.droid .scr{border-radius:30px}
.island{position:absolute;left:50%;top:12px;width:112px;height:32px;margin-left:-56px;border-radius:20px;background:#14110D;z-index:3}
.punch{position:absolute;left:50%;top:16px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#14110D;z-index:3}
.sb{position:absolute;left:30px;right:30px;top:16px;display:flex;justify-content:space-between;font:650 18px var(--ui)}
.hd{position:absolute;left:26px;right:26px;top:62px}
.hd small{display:block;font:600 18px var(--ui);color:var(--muted);letter-spacing:.02em}
.hd h2{font:800 40px var(--ui);font-stretch:112%;letter-spacing:-.02em;line-height:1.1}
.chip{position:absolute;right:0;top:10px;font:600 18px var(--mono);background:var(--ink);color:var(--sprout);border-radius:20px;padding:6px 14px}
.seg{position:absolute;left:22px;right:22px;top:154px;height:46px;border-radius:23px;background:var(--appline);display:flex;font:650 18px var(--ui)}
.seg div{flex:1;display:grid;place-items:center;position:relative;z-index:1}
.seg .knob{position:absolute;top:4px;bottom:4px;width:calc(33.3% - 6px);left:4px;border-radius:19px;background:var(--cream);box-shadow:0 2px 6px rgba(0,0,0,.12);z-index:0}
.pane{position:absolute;left:0;right:0;top:214px;bottom:0}
.row{position:absolute;left:18px;right:18px;height:76px;border-radius:20px;background:var(--cream);display:flex;align-items:center}
.row svg.pot{width:66px;height:76px;flex:none;margin-left:6px;overflow:visible}
.row .nm{flex:1;padding-left:8px}
.row .nm b{display:block;font:700 22px var(--ui)}
.row .nm span{display:block;font:500 18px var(--ui);color:var(--muted)}
.drop{width:50px;height:50px;border-radius:50%;margin-right:14px;display:grid;place-items:center;background:var(--appline)}
.drop svg{width:22px;height:22px}
.tap{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:rgba(24,20,15,.18);border:3px solid rgba(24,20,15,.35);opacity:0;z-index:5}
.banner{position:absolute;left:18px;right:18px;border-radius:20px;background:var(--ink);color:var(--cream);padding:16px 18px;font:600 19px var(--ui);line-height:1.3;opacity:0}
.banner em{font-style:normal;color:var(--sprout)}
.gbed{position:absolute;left:0;right:0;top:0;height:446px;overflow:hidden}
.gbed .sk{position:absolute;inset:0;background:linear-gradient(#E6E9D9,#F4EFE6)}
.gbed svg{position:absolute;inset:0;overflow:visible}
.glab{position:absolute;top:404px;width:80px;margin-left:-40px;text-align:center;font:600 18px var(--ui);color:var(--cream)}
.widget{position:absolute;width:340px;height:340px;border-radius:72px;background:var(--soil);color:var(--cream);padding:30px;font-family:var(--ui);box-shadow:0 30px 70px rgba(0,0,0,.3);transform-origin:50% 50%}
.widget b{font:800 30px var(--ui)}
.widget span{display:block;font:600 20px var(--ui);color:var(--sprout);margin-top:6px}
.widget svg{position:absolute;right:26px;bottom:20px;overflow:visible}
#demo{position:absolute;font:500 20px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:8px;background:rgba(24,20,15,.72);color:var(--cream);z-index:20}
#grain{position:absolute;inset:-50%;opacity:.07;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
#cap{position:absolute;left:7%;right:7%;text-align:center;font:600 34px var(--ui);color:var(--cream);z-index:30;line-height:1.35}
#cap span{background:rgba(24,20,15,.84);padding:.08em .45em;border-radius:.3em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
svg.word path{fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.word path.leafk{stroke:none}
</style>
</head>
<body>
<div id="stage">
 <div id="cam">
  <div id="sky" class="L"></div>
  <div id="above" class="L"></div>
  <div id="soil" class="L"><div class="strata"></div>
    <svg class="fringe" preserveAspectRatio="none" viewBox="0 0 1000 30"><path id="fr" fill="#18140F"/></svg></div>
  <div id="under" class="L"></div>
 </div>
 <div id="demo" data-small>Concept demo · Streak is fictional</div>
 <div id="grain"></div>
 <div id="cap"><span></span></div>
</div>
<script src="techniques.js"></script>
<script>
/* ============================================================ engine (kept from the DENT video kit) */
const Q = new URLSearchParams(location.search), W = +Q.get('w') || 1920, H = +Q.get('h') || 1080, PORT = H > W;
const stage = document.getElementById('stage'), cam = document.getElementById('cam');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const U = Math.min(W, H) / 1080;
let TL;
const F = window.DENTFX;
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, start, dur) => clamp((t - start) / dur);
const eOut = (x) => 1 - Math.pow(1 - clamp(x), 4);
const eIn = (x) => Math.pow(clamp(x), 3);
const eIO = (x) => { x = clamp(x); return x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2; };
const spring = (dt, f = 2.2, z = .35) => dt <= 0 ? 0 : 1 - Math.exp(-z * f * 2 * Math.PI * dt) * Math.cos(f * Math.sqrt(1 - z * z) * 2 * Math.PI * dt);
// growth spring: the film's own motion token (organic, slight overshoot, settles fast)
const grow = (dt) => spring(dt, 1.6, .5);
const fall = (dt, h, g = 4200) => Math.min(h, 0.5 * g * dt * dt);
const S = (el, o) => {
  const tr = `translate(${(o.x || 0) * U}px,${(o.y || 0) * U}px) scale(${o.s ?? 1}${o.sy !== undefined ? ',' + o.sy : ''}) rotate(${o.r || 0}deg)`;
  el.style.transform = tr; if (o.o !== undefined) el.style.opacity = o.o;
};
const px = (v) => v * U + 'px';
function lines(el, t, start, stagger = .09, dur = .55) {
  el.querySelectorAll('.line>span').forEach((s, i) => { const k = eOut(P(t, start + i * stagger, dur)); S(s, { y: (1 - k) * 140, o: 1 }); });
}
function livingFrame(t, sceneStart) { const k = t - sceneStart; S(cam, { s: 1 + .010 * k, x: Math.sin(k * .7) * 3, y: Math.cos(k * .5) * 2 }); }

/* ============================================================ film: "Roots" (bible in VIDEO.md)
   Transition family: the HORIZON CROSSING. The camera sinks below or rises above the soil line; the soil edge is the wipe.
   One exception at the climax: the push THROUGH the phone screen into the roots (25.0 s). */
const sky = document.getElementById('sky'), above = document.getElementById('above'), soil = document.getElementById('soil'), under = document.getElementById('under');
const strata = soil.querySelector('.strata');
const rnd = F.rand(42);
// soil fringe (a ragged top edge, re-seeded on twos so it breathes)
const fr = document.getElementById('fr');
function fringe(t) { const r = F.rand(5 + Math.floor(t * 12) % 4); let d = 'M0 30 L0 14'; for (let i = 0; i <= 100; i++) d += ` L${i * 10} ${10 + r() * 8}`; fr.setAttribute('d', d + ' L1000 30Z'); }
// pebbles and motes (parallax depth in the soil)
const pebbles = [];
for (let i = 0; i < 26; i++) { const p = $(`<div class="pebble"></div>`); const s = (8 + rnd() * 26) * U; p.style.width = s + 'px'; p.style.height = s * .7 + 'px';
  pebbles.push({ el: p, x: rnd() * W, y: rnd() * 1.6, z: .6 + rnd() * 1.2 }); soil.append(p); }
const motes = [];
for (let i = 0; i < 18; i++) { const m = $(`<div class="mote"></div>`); motes.push({ el: m, x: rnd() * W, y: rnd(), ph: rnd() * 6 }); under.append(m); }

/* ---------- layout per ratio */
const LS = PORT ? {
  hyApp: .56, phoneX: 540, phoneW: 1.05, bury: 60, stX: 80, stY: 1262, stW: 920, capY: .785,
  grid: { cols: 5, rows: 6, cell: 130, gap: 14, x: 193, y: 560 }, counter: { x: 0, y: 250, size: 230, center: true },
} : {
  hyApp: .76, phoneX: 600, phoneW: 1.12, bury: 250, stX: 1010, stY: 190, stW: 840, capY: .875,
  grid: { cols: 10, rows: 3, cell: 112, gap: 14, x: 610, y: 400 }, counter: { x: 120, y: 360, size: 300, center: false },
};

/* ---------- custom lettering: "streak" as one root writing itself (monoline, round caps, a leaf for the k's arm) */
const WORD = [
  { d: 'M62 14 C48 0 6 -2 6 26 C6 52 64 44 64 74 C64 104 14 104 0 86', x: 0 },          // s
  { d: 'M22 -58 L22 82 C22 98 34 102 50 98 M0 0 L48 0', x: 82 },                           // t
  { d: 'M0 0 L0 100 M0 44 C6 10 28 0 54 4', x: 150 },                                       // r
  { d: 'M2 52 L70 52 C70 20 54 0 36 0 C12 0 0 24 0 50 C0 80 16 100 40 100 C56 100 66 92 72 82', x: 222 }, // e
  { d: 'M66 0 L66 100 M66 50 C66 20 52 0 34 0 C12 0 0 24 0 50 C0 78 14 100 34 100 C52 100 66 80 66 50', x: 316 }, // a
  { d: 'M0 -62 L0 100 M16 58 L62 100', x: 408 },                                            // k (stem + leg)
];
const LEAF_K = 'M2 60 C12 14 46 -4 84 -10 C78 30 50 58 2 60 Z';
function wordSVG(id, stroke, sw) {
  return `<svg class="word" id="${id}" viewBox="-20 -90 520 220" style="overflow:visible">
    ${WORD.map(g => `<path d="${g.d}" transform="translate(${g.x} 0)" stroke="${stroke}" stroke-width="${sw}"/>`).join('')}
    <g transform="translate(408 0)"><path class="leafk" d="${LEAF_K}" fill="var(--sprout)"/></g>
  </svg>`;
}
function drawWord(svg, t, start, draw = .32, stagger = .3) {
  const ps = svg.querySelectorAll('path');
  ps.forEach((p, i) => {
    if (p.classList.contains('leafk')) { const k = Math.max(0, grow(t - (start + 5 * stagger + draw * .8))); p.setAttribute('transform', `translate(2 60) scale(${k}) translate(-2 -60)`); return; }
    const L = p.__len || (p.__len = p.getTotalLength()); const k = eIO(P(t, start + i * stagger, draw));
    p.style.strokeDasharray = L; p.style.strokeDashoffset = L * (1 - k); p.style.visibility = k > .002 ? 'visible' : 'hidden';
  });
}

/* ---------- plants (one function draws a habit plant at any growth stage; deterministic in t) */
function leafPath(len, wide) { return `M0 0 C${len * .25} ${-wide} ${len * .7} ${-wide} ${len} 0 C${len * .7} ${wide * .7} ${len * .25} ${wide * .7} 0 0 Z`; }
function plant(stage, wilt, t, seed, sc = 1, flowerCol = 'var(--root)') {
  // stage 0..1 = height, leaves, bloom. wilt 0..1 = droop + ochre.
  const h = (14 + 120 * stage) * sc, sway = Math.sin(t * 1.4 + seed) * 2.2 * sc * (1 - wilt);
  const bend = wilt * 78 * sc;
  const tipX = sway + bend * .9, tipY = -h + bend * .55;
  const col = wilt > .01 ? `color-mix(in oklab, var(--leaf) ${Math.round(100 - wilt * 75)}%, var(--wilt))` : 'var(--leaf)';
  let s = `<path d="M0 0 Q${sway * .3} ${-h * .55} ${tipX} ${tipY}" fill="none" stroke="${col}" stroke-width="${4 * sc}" stroke-linecap="round"/>`;
  const n = stage * 6;
  for (let i = 0; i < Math.ceil(n); i++) {
    const f = (i + 1) / 7, k = clamp(n - i), side = i % 2 ? 1 : -1;
    const lx = sway * .3 * f + bend * f * f * .9, ly = -h * f + bend * f * f * .55;
    const len = (16 + 10 * stage) * sc * k, rot = side > 0 ? -28 + wilt * 70 : 208 - wilt * 70;
    s += `<path d="${leafPath(len, len * .38)}" transform="translate(${lx} ${ly}) rotate(${rot})" fill="${col}"/>`;
  }
  if (stage > .72) { const b = clamp((stage - .72) / .2) * (1 - wilt * .6);
    for (let p = 0; p < 5; p++) { const a = p * 72 + t * 8; s += `<ellipse cx="${tipX + Math.cos(a * Math.PI / 180) * 7 * sc * b}" cy="${tipY + Math.sin(a * Math.PI / 180) * 7 * sc * b}" rx="${7 * sc * b}" ry="${4.5 * sc * b}" transform="rotate(${a} ${tipX} ${tipY})" fill="${flowerCol}"/>`; }
    s += `<circle cx="${tipX}" cy="${tipY}" r="${4 * sc * b}" fill="var(--soil)"/>`; }
  return s;
}
const POT = (sc = 1) => `<path d="M${-17 * sc} 0 L${17 * sc} 0 L${13 * sc} ${22 * sc} L${-13 * sc} ${22 * sc} Z" fill="#B9775B"/><rect x="${-19 * sc}" y="${-3 * sc}" width="${38 * sc}" height="${6 * sc}" rx="${2 * sc}" fill="#A2654B"/>`;

/* ---------- habits (fictional demo data) */
const HABITS = [
  { n: 'Read 10 pages', fl: 'var(--root)' }, { n: 'Walk 20 min', fl: '#D98C7A' }, { n: 'Stretch', fl: '#A99BE0' },
  { n: 'Journal', fl: 'var(--root)' }, { n: 'No phone in bed', fl: '#D98C7A' },
];
const DROP = '<svg viewBox="0 0 24 24"><path d="M12 2 C12 2 4 11 4 15.5 A8 8 0 0 0 20 15.5 C20 11 12 2 12 2Z" fill="currentColor"/></svg>';

function makePhone(droid) {
  const el = $(`<div class="phone ${droid ? 'droid' : ''}"><div class="scr">
    ${droid ? '<div class="punch"></div>' : '<div class="island"></div>'}
    <div class="sb"><span>9:41</span><span>▮▮▮ ◔</span></div>
    <div class="hd"><small class="dow">Tuesday</small><h2>Today</h2><div class="chip">Day 12</div></div>
    <div class="seg"><div class="knob"></div><div>Today</div><div>Garden</div><div>Roots</div></div>
    <div class="pane today">${HABITS.map((h, i) => `<div class="row" style="top:${i * 86}px"><svg class="pot" viewBox="-33 -64 66 92"><g class="pl"></g>${POT()}</svg>
      <div class="nm"><b>${h.n}</b><span class="sub">2 leaves</span></div><div class="drop" style="color:var(--muted)">${DROP}</div></div>`).join('')}</div>
    <div class="pane garden" style="opacity:0"><div class="gbed"><div class="sk"></div><svg viewBox="0 0 386 446"><rect x="0" y="380" width="386" height="66" fill="#5B4636"/><g class="gp"></g></svg>
      ${HABITS.map((h, i) => `<div class="glab" style="left:${43 + i * 75}px">${['Read', 'Walk', 'Stretch', 'Journal', 'Unplug'][i]}</div>`).join('')}</div></div>
    <div class="banner"></div>
    <div class="tap"></div>
  </div></div>`);
  return el;
}

/* ============================================================ scenes */
// S1 hook: the checkmark grid (sterile)
const G = LS.grid, cells = [];
const hook = $(`<div class="L"></div>`); above.append(hook);
for (let i = 0; i < 30; i++) {
  const c = i % G.cols, r = Math.floor(i / G.cols);
  const el = $(`<div class="cell" style="left:${px(G.x + c * (G.cell + G.gap))};top:${px(G.y + r * (G.cell + G.gap))};width:${px(G.cell)};height:${px(G.cell)}"><b>${i + 1}</b>
    <svg viewBox="0 0 100 100"><path class="ck" d="M24 54 L42 72 L78 30" fill="none" stroke="var(--steel)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="sp" d="" fill="var(--leaf)" opacity="0"/></svg></div>`);
  hook.append(el); cells.push(el);
}
const counter = $(`<div class="a" style="${LS.counter.center ? 'left:0;right:0;text-align:center' : 'left:' + px(LS.counter.x)};top:${px(LS.counter.y)}">
  <div class="lab" style="font-size:${px(26)};color:#5E6469">day streak</div>
  <div class="num" style="font:700 ${px(LS.counter.size)}/.95 var(--mono);color:var(--steel);font-variant-numeric:tabular-nums;letter-spacing:-.04em">0</div></div>`);
hook.append(counter);
const xMark = $(`<svg class="a" viewBox="0 0 100 100" style="overflow:visible"><path d="M28 28 L72 72 M72 28 L28 72" stroke="var(--miss)" stroke-width="11" stroke-linecap="round" fill="none"/></svg>`);
hook.append(xMark);
// S2 the falling check -> sprout (signature device: the checkmark becomes a seedling)
const seedSvg = $(`<svg class="a" viewBox="-100 -140 200 200" style="overflow:visible;width:${px(200)};height:${px(200)}">
  <path class="stem" d="" stroke="var(--leaf)" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path class="armL" stroke-linejoin="round" stroke-width="14"/><path class="armR" stroke-linejoin="round" stroke-width="14"/></svg>`);
above.append(seedSvg);
// morph shapes share structure: M C C Z
const ARM_L0 = 'M0 0 C-6 -6 -14 -14 -22 -22 C-14 -14 -6 -6 0 0 Z', ARM_L1 = 'M0 0 C-4 -34 -44 -52 -78 -44 C-66 -16 -32 2 0 0 Z';
const ARM_R0 = 'M0 0 C12 -14 26 -32 40 -48 C26 -32 12 -14 0 0 Z', ARM_R1 = 'M0 0 C8 -40 52 -64 92 -60 C80 -24 40 0 0 0 Z';
// S3 underground wordmark
const word1 = $(`<div class="a" style="left:0;right:0;top:${PORT ? px(760) : px(330)};display:flex;justify-content:center">${wordSVG('w1', 'var(--root)', 15)}</div>`);
under.append(word1); const w1 = word1.querySelector('svg'); w1.style.width = px(PORT ? 900 : 1000);
const tag1 = $(`<div class="a st" style="left:0;right:0;text-align:center;top:${PORT ? px(1130) : px(720)};font-size:${px(56)};color:var(--cream)"><span class="line"><span><i>habits that</i> grow</span></span></div>`);
under.append(tag1);
const taproot = $(`<svg class="a" style="left:0;top:0;width:${W}px;height:${H}px;overflow:visible" viewBox="0 0 ${W} ${H}"><path fill="none" stroke="var(--root)" stroke-width="${7 * U}" stroke-linecap="round"/></svg>`);
under.append(taproot);

// S4-S6 the phone (iOS-style) planted in the soil
const phone = makePhone(false); above.append(phone);
const phoneRoots = $(`<svg class="a" style="left:0;top:0;width:${W}px;height:${H}px;overflow:visible" viewBox="0 0 ${W} ${H}"></svg>`); under.append(phoneRoots);
const st = $(`<div class="a" style="left:${px(LS.stX)};top:${px(LS.stY)};width:${px(LS.stW)}"></div>`); above.append(st);
const stU = $(`<div class="a" style="left:${px(LS.stX)};top:${px(LS.stY)};width:${px(LS.stW)};color:var(--cream)"></div>`); under.append(stU);
const dayBig = $(`<div class="a" style="font:700 ${px(PORT ? 120 : 170)}/1 var(--mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums;opacity:0"></div>`);
// S7 roots (full frame) + title at the peak
