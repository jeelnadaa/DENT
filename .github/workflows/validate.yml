name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill
        run: python scripts/validate.py
      - name: Validate JSON manifests
        run: |
          python -m json.tool .claude-plugin/plugin.json > /dev/null
          python -m json.tool .claude-plugin/marketplace.json > /dev/null
      - name: Commands are generated and in sync
        run: |
          python scripts/build_commands.py
          git diff --exit-code -- commands skills/dent/commands docs/COMMANDS.md
      - name: Install Playwright (for tool tests)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Tool regression tests (verify_page.py, contrast.py)
        run: python scripts/test_tools.py
      - name: Build package
        run: python scripts/package.py
