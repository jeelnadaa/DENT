# Cloudflare Workers configuration for the DENT landing page (static assets, no Worker code).
# Cloudflare's Git integration runs `npx wrangler deploy`, which reads this file.
#
# What gets published: only the `site/` folder (a static site, no build step).
#   site/index.html        the landing page (HTML, CSS and JS inline)
#   site/404.html          shown for unknown paths (not_found_handling below)
#   site/assets/           benchmark screenshots, share image, app icon
#   site/_headers          security and cache headers (supported by Workers static assets)
#   site/robots.txt, site/sitemap.xml
#
# Dashboard settings (Workers & Pages > your "dent" project > Settings > Build):
#   Build command:   (leave empty)
#   Deploy command:  npx wrangler deploy
#   Root directory:  /   (the repo root, where this file lives)
# Custom domain: Settings > Domains & Routes > Add > Custom domain > dent.solarquack.in

name = "dent"
compatibility_date = "2026-11-01"

[assets]
directory = "./site"
not_found_handling = "404-page"
